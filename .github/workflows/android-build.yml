name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sony Cable Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd flutter_operator_app
          flutter pub get

      - name: Build Flutter Release APK
        run: |
          cd flutter_operator_app
          flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          cp flutter_operator_app/build/app/outputs/flutter-apk/app-release.apk SonyCable_Operator.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sony Cable Operator App (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Sony Cable Operator Mobile App
            - Low-size optimized Release APK
            - In-App Auto Update & Check for Updates
            - Recharge Expenses & Profit Statement
            - Live MSO Rates Management
            - Camera Barcode Scanner for STB & VC
            - 100% English User Interface
            
            **Download SonyCable_Operator.apk below to install or update on your Android device.**
          files: SonyCable_Operator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
