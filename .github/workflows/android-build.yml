name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sony Cable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare SonyCable.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SonyCable.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sony Cable Network App (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 Sony Cable Network Mobile App
            - Official DishTV & Sony Cable Network App Icon
            - Customer due balance highlight in collections
            - Fast payments collection & recharge
            
            **Download SonyCable.apk below to install on your Android device.**
          files: android/app/build/outputs/apk/debug/SonyCable.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
